name: Python application

# Run this workflow when code is pushed to main or a PR targets main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Restrict default token permissions to read-only repository content.
permissions:
  contents: read

jobs:
  # single CI job: install tools, run lint/tests, and publish test artifacts.
  build:
    # Use GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Download repository source code into the runner workspace
      - uses: actions/checkout@v4

      # Install the required Pypthon version for this project
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Upgrade pip and install all project dependencies form requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install a stable Chrome browser build for selenium tests.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable